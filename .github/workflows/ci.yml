name: CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t devops-lab-service-ci -f docker/Dockerfile .

      - name: Run container
        run: |
          docker run -d --name devops-lab-service-ci-container -p 8000:8000 devops-lab-service-ci
          sleep 5

      - name: Check service availability
        run: |
          curl http://localhost:8000
          curl http://localhost:8000/tasks
          curl http://localhost:8000/metrics

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs devops-lab-service-ci-container || true

      - name: Stop and remove container
        if: always()
        run: |
          docker stop devops-lab-service-ci-container || true
          docker rm devops-lab-service-ci-container || true
